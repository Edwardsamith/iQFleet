spring.application.name=iQFleet

# ──────────────────────────────────────────────
# PostgreSQL datasource
# ──────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/iQfleet
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

# ──────────────────────────────────────────────
# JPA / Hibernate  (code-first)
# create      → drops + re-creates all tables on startup
# update      → applies only incremental changes (use after initial create)
# validate    → verifies the schema matches entities without changing it
# ──────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ──────────────────────────────────────────────
# Schema DDL logging (shows CREATE TABLE with CHECK constraints for enums)
# ──────────────────────────────────────────────
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.tool.schema=DEBUG
